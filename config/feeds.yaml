# ---------------------------------------------------------------------------
# forums — fils de discussion, section dédiée, sans LLM.
#
# Le forum de la conquête spatiale (Forumactif) expose un flux par rubrique,
# via /feed/?f=<id>. On ne suit donc que les rubriques choisies, pas le flux
# global du forum.
#
# Une entrée correspond à un *fil* et non à un message : le flux liste les
# discussions récemment animées, avec la date et le texte de leur dernier
# message. Le guid étant l'adresse du fil, il ne change jamais — d'où le
# `kind: forum`, qui intègre la date de dernière activité à la clé de
# déduplication (voir src/fetcher.py). Sans lui, un fil ne serait signalé
# qu'une fois puis passé sous silence, même très actif ensuite.
#
# Pour ajouter une rubrique : ouvrir la page de la rubrique, relever l'id
# dans l'URL (/f49-spacex → 49) et l'ajouter ci-dessous.
# ---------------------------------------------------------------------------
forums:
  - url: https://www.forum-conquete-spatiale.fr/feed/?f=10
    name: Forum CS — Europe
    kind: forum
    lang: fr

  - url: https://www.forum-conquete-spatiale.fr/feed/?f=18
    name: Forum CS — Propulsions et lanceurs
    kind: forum
    lang: fr

  - url: https://www.forum-conquete-spatiale.fr/feed/?f=4
    name: Forum CS — Chine
    kind: forum
    lang: fr

  - url: https://www.forum-conquete-spatiale.fr/feed/?f=11
    name: Forum CS — Asie
    kind: forum
    lang: fr

  - url: https://www.forum-conquete-spatiale.fr/feed/?f=49
    name: Forum CS — SpaceX
    kind: forum
    lang: fr

  - url: https://www.forum-conquete-spatiale.fr/feed/?f=59
    name: Forum CS — Rocket Lab
    kind: forum
    lang: fr

  - url: https://www.forum-conquete-spatiale.fr/feed/?f=61
    name: Forum CS — Blue Origin
    kind: forum
    lang: fr

  - url: https://www.forum-conquete-spatiale.fr/feed/?f=53
    name: Forum CS — ULA
    kind: forum
    lang: fr

  - url: https://www.forum-conquete-spatiale.fr/feed/?f=55
    name: Forum CS — Autres sociétés privées US
    kind: forum
    lang: fr


# ---------------------------------------------------------------------------
# social — comptes X des concurrents suivis, section dédiée, sans LLM.
#
# X n'a plus d'API de lecture gratuite depuis 2023 ; ces flux passent par
# Nitter, un relais tiers. Conséquences à connaître :
#   - c'est une dépendance fragile, les instances publiques ferment souvent.
#     Si celle-ci tombe, la section disparaît sans casser le digest.
#   - `kind: nitter` déclenche un post-traitement (voir src/fetcher.py) :
#     les retweets et les réponses sont écartés, et les liens sont réécrits
#     vers x.com pour rester valides le jour où le relais change.
#
# Comptes vérifiés le 2026-08-08. Certains sont durablement inactifs mais
# conservés : le filtre de fraîcheur les écarte tout seul, et ils reprendront
# leur place si l'entreprise se remet à publier.
# ---------------------------------------------------------------------------
social:
  - url: https://nitter.net/RocketLab/rss
    name: Rocket Lab (@RocketLab)
    kind: nitter
    lang: en

  - url: https://nitter.net/isaraerospace/rss
