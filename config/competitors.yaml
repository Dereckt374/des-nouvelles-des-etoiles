# Acteurs suivis nommément — segment lanceur léger élargi (< 2 t en LEO).
#
# Un lancement est "mis en avant" (fiche enrichie) si son opérateur OU son
# lanceur correspond à une entrée ci-dessous. La correspondance est faite sur
# le nom normalisé (casse et accents ignorés), en cherchant l'alias comme
# sous-chaîne du nom renvoyé par Launch Library 2.
#
# `aliases` sert quand l'API nomme l'entreprise autrement que la presse
# (ex. Space Pioneer y figure sous sa raison sociale chinoise).
# `vehicles` permet de rattraper les cas où l'opérateur diffère du constructeur.

competitors:
  # --- Europe ---------------------------------------------------------------
  - name: Isar Aerospace
    region: europe
    vehicles: [Spectrum]

  - name: Rocket Factory Augsburg
    region: europe
    aliases: [Rocket Factory, RFA]
    vehicles: [RFA One]

  - name: Orbex
    region: europe
    vehicles: [Prime]

  - name: Skyrora
    region: europe
    vehicles: [Skyrora XL]

  - name: PLD Space
    region: europe
    vehicles: [Miura]

  - name: Latitude
    region: europe
    vehicles: [Zephyr]

  - name: MaiaSpace
    region: europe
    aliases: [Maia Space]
    vehicles: [Maia]

  - name: HyImpulse
    region: europe
    aliases: [HyImpulse Technologies]
    vehicles: [SL1]

  - name: Avio
    region: europe
    aliases: [Avio S.p.A]
    vehicles: [Vega]

  # --- Amérique du Nord -----------------------------------------------------
